name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
PLANETARY_MODE = "single"
UMBRELLA_ENFORCEMENT = "strict"
MAXOS_MODULE = "local"

[[durable_objects.bindings]]
name = "KERNEL_DO"
class_name = "KernelDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KernelDO"]

[build]
command = "npm run build"
